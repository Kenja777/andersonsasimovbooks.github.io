<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch 9 — Anderson's Asimov Books</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#253044;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#182c4a;color:white;padding:28px max(20px,calc((100vw - 1100px)/2))}header h1{margin:0 0 6px;font-size:2rem}header p{margin:0;color:#d8e3f3}main{max-width:1100px;margin:auto;padding:24px 16px 70px}a{color:#1958a7}.back{color:#f3f8ff;display:inline-block;margin-bottom:15px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}input{font-size:16px;padding:11px 13px;border:1px solid #b5c0d2;border-radius:8px;max-width:100%;width:320px}.count{color:#536176}.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:19px}.book{background:white;border:1px solid #dce3ed;border-radius:12px;overflow:hidden;box-shadow:0 2px 7px #17233e0b}.hero{width:100%;height:245px;object-fit:contain;background:#edf1f7;cursor:pointer}.info{padding:15px}.info h2{font-size:1.08rem;margin:0 0 9px;line-height:1.35}.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.photos button{padding:0;border:2px solid transparent;border-radius:5px;background:#eee;cursor:pointer}.photos button:focus-visible{outline:3px solid #2368ac}.photos img{display:block;width:45px;height:58px;object-fit:cover}.photos button.active{border-color:#1b5ea9}.meta{font-size:.9rem;color:#607086}.open{margin-top:12px;display:inline-block;font-size:.91rem}.empty{padding:25px;background:white;border-radius:10px}footer{text-align:center;color:#667;padding:24px}dialog{border:0;border-radius:12px;max-width:95vw;max-height:95vh;padding:10px;background:#fff}dialog img{display:block;max-width:90vw;max-height:80vh;object-fit:contain}dialog .actions{display:flex;justify-content:space-between;gap:10px;padding:9px 4px}button{font:inherit}dialog button{padding:6px 12px;cursor:pointer}@media(max-width:450px){.hero{height:220px}header h1{font-size:1.5rem}}
</style></head>
<body><header><a class="back" href="index.html">← Back to book catalog</a><h1>Batch 9 — Book Photographs</h1><p>Anderson's Asimov Books · 22 books · 124 photographs</p></header>
<main><div class="toolbar"><input id="search" type="search" placeholder="Search for a book title" aria-label="Search book titles"><span class="count" id="count"></span></div><div id="books" class="books"></div></main>
<dialog id="viewer"><div class="actions"><button id="prev">← Previous</button><button id="close">Close ✕</button><button id="next">Next →</button></div><img id="large" alt="Enlarged book photograph"><div id="caption" class="meta"></div></dialog>
<footer>Anderson's Asimov Books · Batch 9</footer>
<script>
const inventory=[{"title": "Still More Lecherous Limericks", "photos": ["IMG_8054.jpg", "IMG_8055.jpg", "IMG_8056.jpg", "IMG_8057.jpg", "IMG_8058.jpg"]}, {"title": "Technology", "photos": ["IMG_8549.jpg", "IMG_8550.jpg", "IMG_8551.jpg", "IMG_8552.jpg"]}, {"title": "The 7 Cardinal Virtues of Science Fiction", "photos": ["IMG_8040.jpg", "IMG_8041.jpg", "IMG_8042.jpg", "IMG_8043.jpg"]}, {"title": "The Annotated Gulliver DJ", "photos": ["IMG_8214.jpg", "IMG_8215.jpg", "IMG_8216.jpg", "IMG_8217.jpg", "IMG_8218.jpg", "IMG_8219.jpg", "IMG_8220.jpg"]}, {"title": "The Best of Isaac Asimov", "photos": ["#-4 Cover.jpg", "IMG_7778.jpg", "IMG_7784.jpg", "IMG_7788.jpg", "IMG_7789.jpg", "IMG_7791.jpg", "IMG_7792.jpg"]}, {"title": "The Best of Isaac Asimov's SF Magazine", "photos": ["IMG_7330.jpg", "IMG_7333.jpg", "IMG_7335.jpg"]}, {"title": "The Bicentennial Man no DJ", "photos": ["IMG_7385.jpg", "IMG_7386.jpg", "IMG_7387.jpg"]}, {"title": "The Birth of the United States", "photos": ["IMG_8408.jpg", "IMG_8409.jpg", "IMG_8410.jpg", "IMG_8411.jpg", "IMG_8412.jpg"]}, {"title": "The Birth of the USA", "photos": ["IMG_8420.jpg", "IMG_8421.jpg", "IMG_8422.jpg", "IMG_8423.jpg", "IMG_8424.jpg"]}, {"title": "The Dangers of Intelligence and Other Science Essays", "photos": ["Cover.jpg", "Front flap.jpg", "IMG_8817.jpg", "IMG_8818.jpg", "IMG_8819.jpg", "IMG_8820.jpg"]}, {"title": "The Disappearing Man", "photos": ["3-4 cover.jpg", "IMG_7404.jpg", "IMG_7405.jpg", "IMG_7406.jpg", "IMG_7407.jpg", "IMG_7408.jpg"]}, {"title": "The Edge of Tomorrow", "photos": ["IMG_7347.jpg", "IMG_7350.jpg", "IMG_7351.jpg", "IMG_7352.jpg", "IMG_7353.jpg"]}, {"title": "The Golden Door VG", "photos": ["IMG_8392.jpg", "IMG_8394.jpg", "IMG_8395.jpg", "IMG_8396.jpg", "IMG_8398.jpg", "IMG_8399.jpg", "IMG_8400.jpg", "IMG_8401.jpg"]}, {"title": "The Land of Canaan", "photos": ["IMG_8425.jpg", "IMG_8426.jpg", "IMG_8427.jpg", "IMG_8428.jpg", "IMG_8429.jpg", "IMG_8430.jpg", "IMG_8431.jpg"]}, {"title": "The Last Man on Earth", "photos": ["IMG_7713.jpg", "IMG_7714.jpg", "IMG_7715.jpg"]}, {"title": "The Little Book of Hand Shadows", "photos": ["IMG_8069.jpg", "IMG_8070.jpg", "IMG_8071.jpg", "IMG_8072.jpg", "IMG_8073.jpg", "IMG_8074.jpg", "IMG_8075.jpg"]}, {"title": "The Planet That Wasn't", "photos": ["IMG_7678.jpg", "IMG_7679.jpg", "IMG_7680.jpg", "IMG_7681.jpg"]}, {"title": "The Positronic Man", "photos": ["IMG_8139.jpg", "IMG_8140.jpg", "IMG_8141.jpg", "IMG_8142.jpg", "IMG_8143.jpg", "IMG_8144.jpg", "IMG_8146.jpg", "IMG_9141.jpg", "IMG_9142.jpg", "IMG_9143.jpg"]}, {"title": "The Science Fiction Weight-Loss Book", "photos": ["IMG_8201.jpg", "IMG_8202.jpg", "IMG_8203.jpg", "IMG_8204.jpg", "IMG_8205.jpg", "IMG_8206.jpg", "IMG_8207.jpg"]}, {"title": "The Secret of the Universe", "photos": ["IMG_7980.jpg", "IMG_7981.jpg", "IMG_7982.jpg", "IMG_7983.jpg", "IMG_7984.jpg", "IMG_7985.jpg", "IMG_7986.jpg"]}, {"title": "The Shaping of France", "photos": ["IMG_8457.jpg", "IMG_8458.jpg", "IMG_8459.jpg", "IMG_8460.jpg", "IMG_8461.jpg"]}, {"title": "The Shaping of North America", "photos": ["IMG_8431.jpg", "IMG_8432.jpg", "IMG_8433.jpg", "IMG_8434.jpg", "IMG_8435.jpg", "IMG_8436.jpg"]}];
const fileUrl=(title,file)=>encodeURIComponent(title)+'/'+encodeURIComponent(file);
const container=document.getElementById('books');const search=document.getElementById('search');
const dialog=document.getElementById('viewer'),large=document.getElementById('large'),caption=document.getElementById('caption');
let activeBook=null,activeIndex=0;
function showLarge(book,index){activeBook=book;activeIndex=(index+book.photos.length)%book.photos.length;large.src=fileUrl(book.title,book.photos[activeIndex]);large.alt=book.title+' — photograph '+(activeIndex+1);caption.textContent=book.title+' · Photograph '+(activeIndex+1)+' of '+book.photos.length;if(!dialog.open)dialog.showModal()}
document.getElementById('close').onclick=()=>dialog.close();document.getElementById('prev').onclick=()=>showLarge(activeBook,activeIndex-1);document.getElementById('next').onclick=()=>showLarge(activeBook,activeIndex+1);
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});document.addEventListener('keydown',e=>{if(!dialog.open)return;if(e.key==='ArrowRight')showLarge(activeBook,activeIndex+1);if(e.key==='ArrowLeft')showLarge(activeBook,activeIndex-1)});
function render(){const q=search.value.trim().toLowerCase();const found=inventory.filter(b=>b.title.toLowerCase().includes(q));container.replaceChildren();document.getElementById('count').textContent=found.length+' of '+inventory.length+' books';if(!found.length){const p=document.createElement('p');p.className='empty';p.textContent='No matching books found.';container.append(p)}
found.forEach(book=>{const card=document.createElement('article');card.className='book';const hero=document.createElement('img');hero.className='hero';hero.loading='lazy';hero.src=fileUrl(book.title,book.photos[0]);hero.alt=book.title+' book photo';hero.onclick=()=>showLarge(book,0);card.append(hero);const info=document.createElement('div');info.className='info';const title=document.createElement('h2');title.textContent=book.title;info.append(title);const meta=document.createElement('div');meta.className='meta';meta.textContent=book.photos.length+' photographs · Click to enlarge';info.append(meta);const thumbs=document.createElement('div');thumbs.className='photos';book.photos.forEach((file,i)=>{const b=document.createElement('button');b.type='button';b.title='Show photograph '+(i+1);if(i===0)b.className='active';const thumb=document.createElement('img');thumb.loading='lazy';thumb.src=fileUrl(book.title,file);thumb.alt='Photo '+(i+1);b.append(thumb);b.onclick=()=>{hero.src=fileUrl(book.title,file);thumbs.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};b.ondblclick=()=>showLarge(book,i);thumbs.append(b)});info.append(thumbs);card.append(info);container.append(card)})}
search.addEventListener('input',render);render();
</script></body></html>
