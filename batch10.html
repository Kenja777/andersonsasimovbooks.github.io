<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch 10 — Anderson's Asimov Books</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#253044;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#182c4a;color:white;padding:28px max(20px,calc((100vw - 1100px)/2))}header h1{margin:0 0 6px;font-size:2rem}header p{margin:0;color:#d8e3f3}main{max-width:1100px;margin:auto;padding:24px 16px 70px}a{color:#1958a7}.back{color:#f3f8ff;display:inline-block;margin-bottom:15px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}input{font-size:16px;padding:11px 13px;border:1px solid #b5c0d2;border-radius:8px;max-width:100%;width:320px}.count{color:#536176}.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:19px}.book{background:white;border:1px solid #dce3ed;border-radius:12px;overflow:hidden;box-shadow:0 2px 7px #17233e0b}.hero{width:100%;height:245px;object-fit:contain;background:#edf1f7;cursor:pointer}.info{padding:15px}.info h2{font-size:1.08rem;margin:0 0 9px;line-height:1.35}.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.photos button{padding:0;border:2px solid transparent;border-radius:5px;background:#eee;cursor:pointer}.photos button:focus-visible{outline:3px solid #2368ac}.photos img{display:block;width:45px;height:58px;object-fit:cover}.photos button.active{border-color:#1b5ea9}.meta{font-size:.9rem;color:#607086}.empty{padding:25px;background:white;border-radius:10px}footer{text-align:center;color:#667;padding:24px}dialog{border:0;border-radius:12px;max-width:95vw;max-height:95vh;padding:10px;background:#fff}dialog img{display:block;max-width:90vw;max-height:80vh;object-fit:contain}dialog .actions{display:flex;justify-content:space-between;gap:10px;padding:9px 4px}button{font:inherit}dialog button{padding:6px 12px;cursor:pointer}@media(max-width:450px){.hero{height:220px}header h1{font-size:1.5rem}}
</style></head>
<body><header><a class="back" href="index.html">← Back to book catalog</a><h1>Batch 10 — Book Photographs</h1><p>Anderson's Asimov Books · 11 books · 56 photographs</p></header>
<main><div class="toolbar"><input id="search" type="search" placeholder="Search for a book title" aria-label="Search book titles"><span class="count" id="count"></span></div><div id="books" class="books"></div></main>
<dialog id="viewer"><div class="actions"><button id="prev">← Previous</button><button id="close">Close ✕</button><button id="next">Next →</button></div><img id="large" alt="Enlarged book photograph"><div id="caption" class="meta"></div></dialog>
<footer>Anderson's Asimov Books · Batch 10</footer>
<script>
const inventory=[{"title": "The Twelve Frights of Christmas", "photos": ["IMG_7675.jpg", "IMG_7676.jpg", "IMG_7677.jpg"]}, {"title": "Through a Glass Clearly", "photos": ["IMG_8025.jpg", "IMG_8026.jpg", "IMG_8027.jpg", "IMG_8028.jpg", "IMG_8029.jpg"]}, {"title": "Venus, Near Neighbor of the Sun", "photos": ["IMG_8846.jpg", "IMG_8848.jpg", "IMG_8849.jpg", "IMG_8850.jpg", "IMG_8852.jpg", "IMG_8853.jpg"]}, {"title": "Where Do We Go From Here BCE", "photos": ["IMG_7375.jpg", "IMG_7376.jpg", "IMG_7379.jpg", "IMG_7380.jpg", "IMG_7381.jpg"]}, {"title": "Where do we go from Here soft", "photos": ["IMG_8020.jpg", "IMG_8021.jpg", "IMG_8022.jpg", "IMG_8024.jpg"]}, {"title": "Young Extraterrestrials", "photos": ["Copyright.jpg", "IMG_8293.jpg", "IMG_8294.jpg", "IMG_8295.jpg", "IMG_8297.jpg", "IMG_8298.jpg"]}, {"title": "Young Ghosts", "photos": ["IMG_8305.jpg", "IMG_8306.jpg", "IMG_8307.jpg", "IMG_8308.jpg", "IMG_8309.jpg", "IMG_8310.jpg"]}, {"title": "Young Monsters", "photos": ["IMG_8286.jpg", "IMG_8288.jpg", "IMG_8289.jpg", "IMG_8290.jpg", "IMG_8291.jpg", "IMG_8292.jpg"]}, {"title": "Young Star Travelers", "photos": ["IMG_8311.jpg", "IMG_8312.jpg", "IMG_8313.jpg", "IMG_8314.jpg", "IMG_8315.jpg"]}, {"title": "Young Witches and Warlocks", "photos": ["IMG_8299.jpg", "IMG_8300.jpg", "IMG_8301.jpg", "IMG_8302.jpg", "IMG_8303.jpg", "IMG_8304.jpg"]}, {"title": "Yours, Isaac Asimov", "photos": ["IMG_9178.jpg", "IMG_9179.jpg", "IMG_9180.jpg", "IMG_9181.jpg"]}];
const fileUrl=(title,file)=>encodeURIComponent(title)+'/'+encodeURIComponent(file);
const container=document.getElementById('books');const search=document.getElementById('search');
const dialog=document.getElementById('viewer'),large=document.getElementById('large'),caption=document.getElementById('caption');
let activeBook=null,activeIndex=0;
function showLarge(book,index){activeBook=book;activeIndex=(index+book.photos.length)%book.photos.length;large.src=fileUrl(book.title,book.photos[activeIndex]);large.alt=book.title+' — photograph '+(activeIndex+1);caption.textContent=book.title+' · Photograph '+(activeIndex+1)+' of '+book.photos.length;if(!dialog.open)dialog.showModal()}
document.getElementById('close').onclick=()=>dialog.close();document.getElementById('prev').onclick=()=>showLarge(activeBook,activeIndex-1);document.getElementById('next').onclick=()=>showLarge(activeBook,activeIndex+1);
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});document.addEventListener('keydown',e=>{if(!dialog.open)return;if(e.key==='ArrowRight')showLarge(activeBook,activeIndex+1);if(e.key==='ArrowLeft')showLarge(activeBook,activeIndex-1)});
function render(){const q=search.value.trim().toLowerCase();const found=inventory.filter(b=>b.title.toLowerCase().includes(q));container.replaceChildren();document.getElementById('count').textContent=found.length+' of '+inventory.length+' books';if(!found.length){const p=document.createElement('p');p.className='empty';p.textContent='No matching books found.';container.append(p)}
found.forEach(book=>{const card=document.createElement('article');card.className='book';const hero=document.createElement('img');hero.className='hero';hero.loading='lazy';hero.src=fileUrl(book.title,book.photos[0]);hero.alt=book.title+' book photo';hero.onclick=()=>showLarge(book,0);card.append(hero);const info=document.createElement('div');info.className='info';const title=document.createElement('h2');title.textContent=book.title;info.append(title);const meta=document.createElement('div');meta.className='meta';meta.textContent=book.photos.length+' photographs · Click to enlarge';info.append(meta);const thumbs=document.createElement('div');thumbs.className='photos';book.photos.forEach((file,i)=>{const b=document.createElement('button');b.type='button';b.title='Show photograph '+(i+1);if(i===0)b.className='active';const thumb=document.createElement('img');thumb.loading='lazy';thumb.src=fileUrl(book.title,file);thumb.alt='Photo '+(i+1);b.append(thumb);b.onclick=()=>{hero.src=fileUrl(book.title,file);thumbs.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};b.ondblclick=()=>showLarge(book,i);thumbs.append(b)});info.append(thumbs);card.append(info);container.append(card)})}
search.addEventListener('input',render);render();
</script></body></html>
