<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch 3 — Anderson's Asimov Books</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#253044;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#182c4a;color:white;padding:28px max(20px,calc((100vw - 1100px)/2))}header h1{margin:0 0 6px;font-size:2rem}header p{margin:0;color:#d8e3f3}main{max-width:1100px;margin:auto;padding:24px 16px 70px}a{color:#1958a7}.back{color:#f3f8ff;display:inline-block;margin-bottom:15px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}input{font-size:16px;padding:11px 13px;border:1px solid #b5c0d2;border-radius:8px;max-width:100%;width:320px}.count,.notice{color:#536176}.notice{font-size:.92rem;margin:0 0 18px}.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:19px}.book{background:white;border:1px solid #dce3ed;border-radius:12px;overflow:hidden;box-shadow:0 2px 7px #17233e0b}.hero{width:100%;height:245px;object-fit:contain;background:#edf1f7;cursor:pointer}.info{padding:15px}.info h2{font-size:1.08rem;margin:0 0 9px;line-height:1.35}.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.photos button{padding:0;border:2px solid transparent;border-radius:5px;background:#eee;cursor:pointer}.photos button:focus-visible{outline:3px solid #2368ac}.photos img{display:block;width:45px;height:58px;object-fit:cover}.photos button.active{border-color:#1b5ea9}.meta{font-size:.9rem;color:#607086}.empty{padding:25px;background:white;border-radius:10px}footer{text-align:center;color:#667;padding:24px}dialog{border:0;border-radius:12px;max-width:95vw;max-height:95vh;padding:10px;background:#fff}dialog img{display:block;max-width:90vw;max-height:80vh;object-fit:contain}dialog .actions{display:flex;justify-content:space-between;gap:10px;padding:9px 4px}button{font:inherit}dialog button{padding:6px 12px;cursor:pointer}@media(max-width:450px){.hero{height:220px}header h1{font-size:1.5rem}}
</style></head>
<body><header><a class="back" href="index.html">← Back to book catalog</a><h1>Batch 3 — Book Photographs</h1><p>Anderson's Asimov Books · 30 books · 139 photographs</p></header>
<main><div class="toolbar"><input id="search" type="search" placeholder="Search for a book title" aria-label="Search book titles"><span class="count" id="count"></span></div><p id="notice" class="notice" aria-live="polite">Loading photograph thumbnails…</p><div id="books" class="books"></div></main>
<dialog id="viewer"><div class="actions"><button id="prev">← Previous</button><button id="close">Close ✕</button><button id="next">Next →</button></div><img id="large" alt="Enlarged book photograph"><div id="caption" class="meta"></div></dialog>
<footer>Anderson's Asimov Books · Batch 3</footer>
<script>
const inventory=[{"title": "1001 Ways To Be Romantic", "folder": "books/batch3/1001-ways-to-be-romantic/", "cover": "IMG_6911.jpg", "count": 5}, {"title": "ABCs of Ecology", "folder": "books/batch3/abcs-of-ecology/", "cover": "IMG_6862.jpg", "count": 4}, {"title": "Anna Karenina", "folder": "books/batch3/anna-karenina/", "cover": "IMG_6795.jpg", "count": 4}, {"title": "Asimov's Chronology of the World", "folder": "books/batch3/asimov-s-chronology-of-the-world/", "cover": "IMG_6678.jpg", "count": 6}, {"title": "Ask Me William Stafford", "folder": "books/batch3/ask-me-william-stafford/", "cover": "IMG_6878.jpg", "count": 5}, {"title": "Beyond Bullet Points", "folder": "books/batch3/beyond-bullet-points/", "cover": "IMG_6732.jpg", "count": 4}, {"title": "Buying Your House", "folder": "books/batch3/buying-your-house/", "cover": "IMG_6781.jpg", "count": 5}, {"title": "Counting the Eons", "folder": "books/batch3/counting-the-eons/", "cover": "IMG_6747.jpg", "count": 5}, {"title": "Earth Our Crowded Spaceship", "folder": "books/batch3/earth-our-crowded-spaceship/", "cover": "IMG_6685.jpg", "count": 5}, {"title": "Extraterrestrial Civilizations", "folder": "books/batch3/extraterrestrial-civilizations/", "cover": "IMG_6618.jpg", "count": 5}, {"title": "Isaac Asimov Foundation's Fear Benford", "folder": "books/batch3/isaac-asimov-foundation-s-fear-benford/", "cover": "IMG_6544.jpg", "count": 4}, {"title": "Isaac Asimov Presents Election Day 2084", "folder": "books/batch3/isaac-asimov-presents-election-day-2084/", "cover": "IMG_6538.jpg", "count": 5}, {"title": "Isaac Asimov Presents the Best Science Fiction Firsts", "folder": "books/batch3/isaac-asimov-presents-the-best-science-fiction-firsts/", "cover": "IMG_6533.jpg", "count": 4}, {"title": "Isaac Asimov's Magical Worlds of Fantasy Witches & Wizards", "folder": "books/batch3/isaac-asimov-s-magical-worlds-of-fantasy-witches-wizards/", "cover": "IMG_6564.jpg", "count": 6}, {"title": "Isaac Asimovs Treasury of Humor", "folder": "books/batch3/isaac-asimovs-treasury-of-humor/", "cover": "IMG_6663.jpg", "count": 5}, {"title": "Learning the Business", "folder": "books/batch3/learning-the-business/", "cover": "IMG_6762.jpg", "count": 3}, {"title": "One Move at a Time", "folder": "books/batch3/one-move-at-a-time/", "cover": "IMG_6778.jpg", "count": 3}, {"title": "Science Fiction Science Fact", "folder": "books/batch3/science-fiction-science-fact/", "cover": "IMG_6858.jpg", "count": 4}, {"title": "Selling Short", "folder": "books/batch3/selling-short/", "cover": "IMG_6786.jpg", "count": 4}, {"title": "Senior Sleuths A Large Print Anthology", "folder": "books/batch3/senior-sleuths-a-large-print-anthology/", "cover": "IMG_6587.jpg", "count": 5}, {"title": "Stay the Course", "folder": "books/batch3/stay-the-course/", "cover": "IMG_6791.jpg", "count": 4}, {"title": "Stories We Need to Know", "folder": "books/batch3/stories-we-need-to-know/", "cover": "IMG_6907.jpg", "count": 4}, {"title": "The Alternate Asimovs", "folder": "books/batch3/the-alternate-asimovs/", "cover": "IMG_6742.jpg", "count": 5}, {"title": "The Edge of Tomorrow", "folder": "books/batch3/the-edge-of-tomorrow/", "cover": "IMG_6582.jpg", "count": 5}, {"title": "The Family Manager Guide For Working Moms", "folder": "books/batch3/the-family-manager-guide-for-working-moms/", "cover": "IMG_6903.jpg", "count": 4}, {"title": "The Measure of the Universe", "folder": "books/batch3/the-measure-of-the-universe/", "cover": "IMG_6623.jpg", "count": 5}, {"title": "The Mini Manual of Card Games", "folder": "books/batch3/the-mini-manual-of-card-games/", "cover": "IMG_6873.jpg", "count": 5}, {"title": "The Solar System and Back", "folder": "books/batch3/the-solar-system-and-back/", "cover": "IMG_6812.jpg", "count": 4}, {"title": "The romance of country inns", "folder": "books/batch3/the-romance-of-country-inns/", "cover": "IMG_7072.jpg", "count": 6}, {"title": "What We May Be", "folder": "books/batch3/what-we-may-be/", "cover": "IMG_6883.jpg", "count": 6}];
// The book inventory is fixed to the original 30 Batch 3 folders. Only photo filenames are discovered.
const encodedPath=p=>p.split('/').map(encodeURIComponent).join('/');
const fileUrl=(book,file)=>encodedPath(book.folder+file);
const container=document.getElementById('books'),search=document.getElementById('search');
const dialog=document.getElementById('viewer'),large=document.getElementById('large'),caption=document.getElementById('caption');
let activeBook=null,activeIndex=0;
for(const book of inventory)book.photos=[book.cover];
function showLarge(book,index){activeBook=book;activeIndex=(index+book.photos.length)%book.photos.length;large.src=fileUrl(book,book.photos[activeIndex]);large.alt=book.title+' — photograph '+(activeIndex+1);caption.textContent=book.title+' · Photograph '+(activeIndex+1)+' of '+book.photos.length;if(!dialog.open)dialog.showModal()}
document.getElementById('close').onclick=()=>dialog.close();document.getElementById('prev').onclick=()=>showLarge(activeBook,activeIndex-1);document.getElementById('next').onclick=()=>showLarge(activeBook,activeIndex+1);
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});document.addEventListener('keydown',e=>{if(!dialog.open)return;if(e.key==='ArrowRight')showLarge(activeBook,activeIndex+1);if(e.key==='ArrowLeft')showLarge(activeBook,activeIndex-1)});
function render(){const q=search.value.trim().toLowerCase();const found=inventory.filter(b=>b.title.toLowerCase().includes(q));container.replaceChildren();document.getElementById('count').textContent=found.length+' of '+inventory.length+' books';if(!found.length){const p=document.createElement('p');p.className='empty';p.textContent='No matching books found.';container.append(p)}
found.forEach(book=>{const card=document.createElement('article');card.className='book';const hero=document.createElement('img');hero.className='hero';hero.loading='lazy';hero.src=fileUrl(book,book.photos[0]);hero.alt=book.title+' book photo';hero.onclick=()=>showLarge(book,0);card.append(hero);const info=document.createElement('div');info.className='info';const title=document.createElement('h2');title.textContent=book.title;info.append(title);const meta=document.createElement('div');meta.className='meta';meta.textContent=book.count+' photographs · Click to enlarge';info.append(meta);const thumbs=document.createElement('div');thumbs.className='photos';book.photos.forEach((file,i)=>{const b=document.createElement('button');b.type='button';b.title='Show photograph '+(i+1);if(i===0)b.className='active';const thumb=document.createElement('img');thumb.loading='lazy';thumb.src=fileUrl(book,file);thumb.alt='Photo '+(i+1);b.append(thumb);b.onclick=()=>{hero.src=fileUrl(book,file);thumbs.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};b.ondblclick=()=>showLarge(book,i);thumbs.append(b)});info.append(thumbs);card.append(info);container.append(card)})}
search.addEventListener('input',render);render();
(async()=>{try{
 const response=await fetch('https://api.github.com/repos/Kenja777/andersonsasimovbooks.github.io/git/trees/main?recursive=1',{headers:{Accept:'application/vnd.github+json'}});
 if(!response.ok)throw new Error('GitHub photo listing is temporarily unavailable (HTTP '+response.status+').');
 const data=await response.json();if(data.truncated)throw new Error('GitHub provided an incomplete photo listing.');
 const photoPaths=new Set((data.tree||[]).filter(e=>e.type==='blob'&&/\.(jpe?g|png|webp|gif)$/i.test(e.path)).map(e=>e.path));
 let missing=[];
 for(const book of inventory){
  const files=[...photoPaths].filter(p=>p.startsWith(book.folder)&&p.slice(book.folder.length).indexOf('/')===-1).map(p=>p.slice(book.folder.length)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(files.includes(book.cover))files.splice(files.indexOf(book.cover),1);
  book.photos=[book.cover,...files];
  if(book.photos.length!==book.count)missing.push(book.title+' ('+book.photos.length+'/'+book.count+')');
 }
 render();
 document.getElementById('notice').textContent=missing.length?'Photographs available; some book photo totals differ from the original catalog: '+missing.join('; '):'All 30 original book folders loaded. Click a thumbnail to change the large photograph.';
 }catch(e){document.getElementById('notice').textContent='Cover photographs remain available, but extra thumbnails could not be loaded: '+e.message+' Refresh the page to try again.';}
})();
</script></body></html>
