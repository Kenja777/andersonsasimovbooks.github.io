<body><header><a class="back" href="index.html">← Back to book catalog</a><h1>Batch 6 — Book Photographs</h1><p>Anderson's Asimov Books · 29 books · 154 photographs</p></header>

<script>
// Fixed inventory made from the original Git Hub Batch 6.zip. No live repository-wide scan.
const inventory=[{"title": "100 Malicious Litte Mysteries", "folder": "100 Malicious Litte Mysteries", "photos": ["3-4 Cover.jpg", "IMG_7098.jpg", "IMG_7099.jpg", "IMG_7100.jpg", "IMG_7101.jpg", "IMG_7102.jpg"]}, {"title": "1001 Ways To Be Romantic", "folder": "1001 Ways To Be Romantic", "photos": ["IMG_6911.jpg", "IMG_6913.jpg", "IMG_6914.jpg", "IMG_6915.jpg", "IMG_6917.jpg"]}, {"title": "Asimov on Science A 30 Year", "folder": "Asimov on Science A 30 Year", "photos": ["IMG_7273.jpg", "IMG_7274.jpg", "IMG_7275.jpg", "IMG_7276.jpg", "IMG_7277.jpg", "IMG_7278.jpg"]}, {"title": "Asimov the Unauthorized Life", "folder": "Asimov the Unauthorized Life", "photos": ["3-4 Cover.jpg", "Copyright.jpg", "IMG_7140.jpg", "IMG_7141.jpg", "IMG_7142.jpg", "IMG_7143.jpg", "IMG_7145.jpg"]}, {"title": "Asimovs Sherlockian Limericks", "folder": "Asimovs Sherlockian Limericks", "photos": ["68-of-250 Limericks.jpg", "IMG_7238.jpg", "IMG_7239.jpg", "IMG_7240.jpg", "IMG_7241.jpg", "IMG_7242.jpg", "IMG_7243.jpg", "IMG_7244.jpg", "IMG_7245.jpg"]}, {"title": "Azazel", "folder": "Azazel", "photos": ["IMG_9151.jpg", "IMG_9152.jpg", "IMG_9153.jpg"]}, {"title": "Bottom Line", "folder": "Bottom Line", "photos": ["IMG_7068.jpg", "IMG_7069.jpg", "IMG_7070.jpg", "IMG_7071.jpg"]}, {"title": "Collapsing Universe", "folder": "Collapsing Universe", "photos": ["IMG_7210.jpg", "IMG_7212.jpg", "IMG_7213.jpg", "IMG_7215.jpg", "IMG_7220.jpg", "IMG_7221.jpg", "IMG_7223.jpg", "Signature.jpg"]}, {"title": "Hidden Fortunes", "folder": "Hidden Fortunes", "photos": ["IMG_7045.jpg", "IMG_7046.jpg", "IMG_7047.jpg", "IMG_7048.jpg", "IMG_7049.jpg"]}, {"title": "Isaac Asimove Presents Best Crime Stories 19th Century", "folder": "Isaac Asimove Presents Best Crime Stories 19th Century", "photos": ["IMG_7146.jpg", "IMG_7147.jpg", "IMG_7148.jpg", "IMG_7149.jpg", "IMG_7150.jpg", "IMG_7151.jpg"]}, {"title": "Magnificent Brain", "folder": "Magnificent Brain", "photos": ["IMG_6930.jpg", "IMG_6931.jpg", "IMG_6932.jpg", "IMG_6933.jpg"]}, {"title": "Mutants", "folder": "Mutants", "photos": ["3-4 cover.jpg", "IMG_7283.jpg", "IMG_7284.jpg", "IMG_7285.jpg", "IMG_7286.jpg"]}, {"title": "New Hugo Winners Vol 1 Wynwood Press 1989", "folder": "New Hugo Winners Vol 1 Wynwood Press 1989", "photos": ["IMG_7130.jpg", "IMG_7131.jpg", "IMG_7132.jpg", "IMG_7133.jpg", "IMG_7134.jpg", "IMG_7135.jpg"]}, {"title": "New Hugo Winners Vol II Baen 1991", "folder": "New Hugo Winners Vol II Baen 1991", "photos": ["3-4 Cover.jpg", "IMG_7094.jpg", "IMG_7095.jpg", "IMG_7096.jpg", "IMG_7097.jpg"]}, {"title": "NightFall", "folder": "NightFall", "photos": ["296 of 750 signed Silverberg Asimov.jpg", "IMG_4484.jpg", "IMG_7246.jpg", "IMG_7247.jpg", "IMG_7249.jpg", "IMG_7250.jpg"]}, {"title": "Peerage 6 Books by Asimov", "folder": "Peerage 6 Books by Asimov", "photos": ["Copyright.jpg", "IMG_7136.jpg", "IMG_7137.jpg", "IMG_7139.jpg", "spine.jpg"]}, {"title": "Romance of Country Inns", "folder": "Romance of Country Inns", "photos": ["IMG_6771.jpg", "IMG_6772.jpg", "IMG_6774.jpg", "IMG_6775.jpg", "IMG_6776.jpg", "IMG_6777.jpg"]}, {"title": "Space Mail paperback", "folder": "Space Mail paperback", "photos": ["IMG_7263.jpg", "IMG_7264.jpg", "IMG_7270.jpg", "IMG_7271.jpg", "IMG_7272.jpg"]}, {"title": "Stories We Need to Know", "folder": "Stories We Need to Know", "photos": ["IMG_6907.jpg", "IMG_6908.jpg", "IMG_6909.jpg", "IMG_6910.jpg"]}, {"title": "The 13 Crimes of SF", "folder": "The 13 Crimes of SF", "photos": ["IMG_7088.jpg", "IMG_7089.jpg", "IMG_7090.jpg", "IMG_7091.jpg"]}, {"title": "The Future in Question", "folder": "The Future in Question", "photos": ["IMG_7307.jpg", "IMG_7308.jpg", "IMG_7309.jpg", "IMG_7710.jpg"]}, {"title": "The Hugo Winners Vol 4", "folder": "The Hugo Winners Vol 4", "photos": ["3-4 cover.jpg", "IMG_7117.jpg", "IMG_7118.jpg", "IMG_7120.jpg", "IMG_7121.jpg", "IMG_7122.jpg", "IMG_7128.jpg"]}, {"title": "The Hugo Winners Vol 5", "folder": "The Hugo Winners Vol 5", "photos": ["3-4 cover.jpg", "IMG_7117.jpg", "IMG_7118.jpg", "IMG_7120.jpg", "IMG_7121.jpg", "IMG_7122.jpg"]}, {"title": "The Hugo Winners Volume 3", "folder": "The Hugo Winners Volume 3", "photos": ["IMG_7112.jpg", "IMG_7113.jpg", "IMG_7114.jpg", "IMG_7115.jpg", "IMG_7116.jpg"]}, {"title": "The Nude in Photography", "folder": "The Nude in Photography", "photos": ["The Nude.jpg"]}, {"title": "The Sport of Crime Barnes", "folder": "The Sport of Crime Barnes", "photos": ["3-4 cover.jpg", "IMG_7103.jpg", "IMG_7104.jpg", "IMG_7105.jpg", "IMG_7106.jpg"]}, {"title": "The Verse Beside the Road", "folder": "The Verse Beside the Road", "photos": ["IMG_7036.jpg", "IMG_7037.jpg", "IMG_7038.jpg", "IMG_7040.jpg", "IMG_7044.jpg"]}, {"title": "The Wall Chart of World History", "folder": "The Wall Chart of World History", "photos": ["IMG_7159 (1).jpg", "IMG_7160 (1).jpg", "IMG_7161.jpg", "IMG_7162.jpg", "IMG_7163 (1).jpg", "IMG_7164.jpg"]}, {"title": "Who Done It", "folder": "Who Done It", "photos": ["3-4 cover.gif", "IMG_7107.jpg", "IMG_7108.jpg", "IMG_7109.jpg", "IMG_7110.jpg", "IMG_7111.jpg"]}];
const base='https://raw.githubusercontent.com/Kenja777/andersonsasimovbooks.github.io/main/';
const fileUrl=(book,file)=>base+encodeURIComponent(book.folder)+'/'+encodeURIComponent(file);
const container=document.getElementById('books'),search=document.getElementById('search');
const dialog=document.getElementById('viewer'),large=document.getElementById('large'),caption=document.getElementById('caption');
let activeBook=null,activeIndex=0;
function showLarge(book,index){activeBook=book;activeIndex=(index+book.photos.length)%book.photos.length;large.src=fileUrl(book,book.photos[activeIndex]);large.alt=book.title+' — photograph '+(activeIndex+1);caption.textContent=book.title+' · Photograph '+(activeIndex+1)+' of '+book.photos.length;if(!dialog.open)dialog.showModal()}
document.getElementById('close').onclick=()=>dialog.close();document.getElementById('prev').onclick=()=>showLarge(activeBook,activeIndex-1);document.getElementById('next').onclick=()=>showLarge(activeBook,activeIndex+1);
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});document.addEventListener('keydown',e=>{if(!dialog.open)return;if(e.key==='ArrowRight')showLarge(activeBook,activeIndex+1);if(e.key==='ArrowLeft')showLarge(activeBook,activeIndex-1)});
function render(){const q=search.value.trim().toLowerCase();const found=inventory.filter(b=>b.title.toLowerCase().includes(q));container.replaceChildren();document.getElementById('count').textContent=found.length+' of '+inventory.length+' books';if(!found.length){const p=document.createElement('p');p.className='empty';p.textContent='No matching books found.';container.append(p)}
found.forEach(book=>{const card=document.createElement('article');card.className='book';const hero=document.createElement('img');hero.className='hero';hero.loading='lazy';hero.src=fileUrl(book,book.photos[0]);hero.alt=book.title+' book photo';hero.onclick=()=>showLarge(book,0);card.append(hero);const info=document.createElement('div');info.className='info';const title=document.createElement('h2');title.textContent=book.title;info.append(title);const meta=document.createElement('div');meta.className='meta';meta.textContent=book.photos.length+' photographs · Click to enlarge';info.append(meta);const thumbs=document.createElement('div');thumbs.className='photos';book.photos.forEach((file,i)=>{const b=document.createElement('button');b.type='button';b.title='Show photograph '+(i+1);if(i===0)b.className='active';const thumb=document.createElement('img');thumb.loading='lazy';thumb.src=fileUrl(book,file);thumb.alt='Photo '+(i+1);b.append(thumb);b.onclick=()=>{hero.src=fileUrl(book,file);thumbs.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};b.ondblclick=()=>showLarge(book,i);thumbs.append(b)});info.append(thumbs);card.append(info);container.append(card)})}
search.addEventListener('input',render);render();
</script></body></html>
