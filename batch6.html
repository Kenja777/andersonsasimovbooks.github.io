<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andersons Asimov Books — Batch 6</title>
<style>
body{font:17px Arial,sans-serif;max-width:1100px;margin:30px auto;padding:0 16px;color:#222;line-height:1.5}a{color:#0759a7}header{padding-bottom:12px;border-bottom:1px solid #ddd}.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.book{border:1px solid #ddd;border-radius:8px;padding:12px}.book img{width:100%;height:220px;object-fit:contain;background:#f4f4f4}.book h2{font-size:19px}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.photos img{width:100%;height:330px;object-fit:contain}.photos a{display:block;border:1px solid #ddd;padding:8px;text-align:center}.gallery{padding-top:18px;margin-top:35px;border-top:2px solid #ddd;scroll-margin-top:20px}.gallery h2{margin-bottom:6px}small{color:#666}.top{display:inline-block;margin-top:12px}
</style>
</head>
<body>
<header><a href="index.html">← Main book catalog</a></header>
<main id="top"><h1>Batch 6 — Book Photo Galleries</h1><p id="status">Loading book photographs…</p><div class="books" id="books"></div><div id="galleries"></div></main>
<script>
// Batch 6 folders are stored directly at the repository root.
// GitHub's public tree listing supplies the exact paths and JPG filenames.
const owner='Kenja777', repo='andersonsasimovbooks.github.io';
const ignore=new Set(['ABCs of Ecology','batch4-photos','batch5-photos','books']);
const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
const isPhoto=p=>/\.(jpe?g|png|webp|gif)$/i.test(p);
const base=`https://raw.githubusercontent.com/${owner}/${repo}/main/`;
const booksEl=document.getElementById('books');
const galleriesEl=document.getElementById('galleries');
const statusEl=document.getElementById('status');
function element(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
(async()=>{
try{
 const response=await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`,{headers:{'Accept':'application/vnd.github+json'}});
 if(!response.ok)throw new Error(`GitHub returned HTTP ${response.status}. Refresh later if its public API limit has been reached.`);
 const result=await response.json();
 if(result.truncated)throw new Error('GitHub returned an incomplete file listing.');
 const photos=new Map();
 for(const f of result.tree||[]){
  if(f.type!=='blob'||!isPhoto(f.path))continue;
  const parts=f.path.split('/');
  if(parts.length!==2||ignore.has(parts[0]))continue;
  if(!photos.has(parts[0]))photos.set(parts[0],[]);
  photos.get(parts[0]).push(f.path);
 }
 const names=Array.from(photos.keys()).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
 let count=0;
 names.forEach((name,i)=>{
  const paths=photos.get(name).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));count+=paths.length;
  const anchor=`book-${i+1}`;
  const card=element('article','book');const cardLink=element('a');cardLink.href='#'+anchor;
  const cover=document.createElement('img');cover.loading='lazy';cover.src=base+encPath(paths[0]);cover.alt=name;
  cardLink.append(cover,element('h2','',name));card.append(cardLink,element('small','',`${paths.length} photograph${paths.length===1?'':'s'}`));booksEl.append(card);
  const section=element('section','gallery');section.id=anchor;section.append(element('h2','',name),element('small','',`${paths.length} photographs — click a picture for the original full-size image`));
  const grid=element('div','photos');
  paths.forEach(path=>{const url=base+encPath(path);const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';const im=document.createElement('img');im.loading='lazy';im.src=url;im.alt=`${name}: ${path.split('/').pop()}`;a.append(im);grid.append(a)});
  section.append(grid);const top=element('a','top','↑ Back to list of books');top.href='#top';section.append(top);galleriesEl.append(section);
 });
 statusEl.textContent=`${names.length} books · ${count} photographs`;
 if(!names.length)statusEl.textContent='No Batch 6 photos found. Check that the book folders contain JPG images in the repository root.';
}catch(err){statusEl.textContent=`Unable to load gallery: ${err.message}`;}
})();
</script>
</body></html>
