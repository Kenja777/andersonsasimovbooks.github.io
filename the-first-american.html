<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The First American — Book Photographs</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#1d3557;background:#f5f7fb}
*{box-sizing:border-box}
body{margin:0}
header{background:#19375f;color:#fff;padding:28px max(20px,calc((100vw - 1100px)/2))}
header h1{margin:0 0 8px;font-size:2rem}
header p{margin:0;color:#dbe7f6}
main{max-width:1100px;margin:auto;padding:24px 16px 60px}
.back{display:inline-block;margin-bottom:18px;color:#1958a7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
figure{margin:0;background:#fff;border:1px solid #d7deea;border-radius:10px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
img{width:100%;height:auto;display:block;border-radius:6px}
figcaption{padding:8px 2px 2px;color:#4b5870;font-size:.95rem}
</style>
</head>
<body>
<header>
  <h1>The First American</h1>
  <p>H. W. Brands — book photograph gallery</p>
</header>
<main>
  <a class="back" href="index.html">← Back to book catalog</a>

    <figure><img src="IMG_5356.JPG" alt="The First American photo 1"><figcaption>Photo 1</figcaption></figure>
    <figure><img src="IMG_5357.JPG" alt="The First American photo 2"><figcaption>Photo 2</figcaption></figure>
    <figure><img src="IMG_5358.JPG" alt="The First American photo 3"><figcaption>Photo 3</figcaption></figure>
    <figure><img src="IMG_5359.JPG" alt="The First American photo 4"><figcaption>Photo 4</figcaption></figure>
    <figure><img src="IMG_5360.JPG" alt="The First American photo 5"><figcaption>Photo 5</figcaption></figure>
    <figure><img src="IMG_5361.JPG" alt="The First American photo 6"><figcaption>Photo 6</figcaption></figure>
    <figure><img src="IMG_5362.JPG" alt="The First American photo 7"><figcaption>Photo 7</figcaption></figure>
  </div>
</main>
</body>
</html>
